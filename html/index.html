<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Timesheet</title>
    <link rel="stylesheet" href="stile/stile.css">
    <script src="js/login.js"></script>
</head>
<body>
    <div class="login-page-container">
        <h1 class="login-welcome-title">Benvenuto/a in Timesheet</h1>
        <div class="login-form-container">
            <form class="login-form" id="loginForm">
                <label for="email" class="login-label">Email</label>
                <input type="email" id="email" class="login-input" placeholder="Inserisci la tua email" required>
                
                <label for="password" class="login-label">Password</label>
                <input type="password" id="password" class="login-input" placeholder="Inserisci la password" required>
                
                <button type="submit" class="login-button">Accedi</button>
            </form>
            <p id="loginMessage" class="login-message"></p>
        </div>
    </div>

    
</body>
</html>
