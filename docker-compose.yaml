version: "3.8"

networks:
  app-net:

volumes:
  db-data:

services:

  # Reverse proxy / gateway
  nginx:
    image: nginx:stable-alpine
    container_name: gateway
    ports:
      - "80:80"
      # Se ti serve HTTPS, aggiungerai qui anche "443:443" e relativa conf
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # (opzionale) log locali
      # - ./nginx/logs:/var/log/nginx
    depends_on:
      - web-html
      - node
    networks:
      - app-net
    restart: unless-stopped

  # Server statico HTML (solo file)
  web-html:
    image: nginx:stable-alpine
    container_name: web-html
    expose:
      - "80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - app-net
    hostname: test.sito1-html
    restart: unless-stopped

  # Backend Node.js
  node:
    image: node:18-alpine
    container_name: app-node
    working_dir: /app
    command: ["node", "server.js"]

    env_file:
      - ./node/.env

    environment:
      - NODE_ENV=production
      # Aggiungi qui le variabili necessarie all'app
      # - DATABASE_URL=mysql://user:pass@db:3306/appdb
    expose:
      - "3000"
    volumes:
      - ./node:/app
    depends_on:
      - db
    networks:
      - app-net
    hostname: test.sito1-node
    restart: unless-stopped

  # Database SQL (MariaDB)
  db:
    image: mariadb:10.11
    container_name: app-db
    environment:
    - MARIADB_DATABASE=${MARIADB_DATABASE}
    - MARIADB_USER=${MARIADB_USER}
    - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - app-net
    hostname: test.sito1-db
    restart: unless-stopped
