# Reverse proxy verso i servizi interni
# /      -> web-html (nginx statico)
# /api/  -> node (porta 3000)

upstream web_html {
    server web-html:80;
    keepalive 32;
}

upstream api_node {
    server app-node:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # In caso servano file grandi
    client_max_body_size 20m;

    # Statici
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web_html;
    }

    # API Node
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (se servono)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

            proxy_pass http://app-node:3000;
    }
}

# Per supportare correttamente websocket con proxy
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
